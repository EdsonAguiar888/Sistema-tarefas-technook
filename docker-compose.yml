







services:
  postgres_db:
    image: postgres:16-alpine
    container_name: container_postgres
    environment:
      POSTGRES_USER: tecnook
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: technook_db
    ports:
      - "5432:5432"

  backend:
    build: ./tarefas_backend-api
    container_name: container_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=tecnook
      - DB_PASS=12345
      - DB_NAME=technook_db
    depends_on:
      - postgres_db
