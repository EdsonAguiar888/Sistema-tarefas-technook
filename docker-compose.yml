  angular:
    build: ./meu-projeto-frontend
    container_name: container_angular
    ports:
      - "4200:4200"
    depends_on:
      - backend


# ==========================================
# DEFINIÇÃO DE VOLUMES E REDES (Nível Raiz)
# ==========================================
volumes:
  postgres_data:

networks:
  rede_aplicacao:
    driver: bridge
    




