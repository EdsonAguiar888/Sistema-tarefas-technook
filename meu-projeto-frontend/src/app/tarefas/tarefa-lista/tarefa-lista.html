<section class="tarefa-lista">
  <h2>Lista de tarefas</h2>
  <ul>
    @for (tarefa of tarefas; track tarefa.titulo) {
      <li [class.concluida]="tarefa.concluida">
        <span>{{ tarefa.titulo }}</span>
        <strong>{{ tarefa.concluida ? 'Concluída' : 'Pendente' }}</strong>
      </li>
    }
  </ul>
</section>
